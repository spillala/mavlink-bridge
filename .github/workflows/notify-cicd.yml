name: Notify DockOps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch mavlink-bridge Release
    runs-on: ubuntu-latest
    steps:
      - name: Send repository dispatch
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          TARGET_REPOSITORY: spillala/dockops-cicd
          APP_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$GITOPS_PAT" ]; then
            echo "GITOPS_PAT is not configured in the mavlink-bridge repository."
            exit 1
          fi

          cat > dispatch.json <<EOF
          {
            "event_type": "mavlink-bridge-updated",
            "client_payload": {
              "repository": "${APP_REPOSITORY}",
              "commit_sha": "${COMMIT_SHA}",
              "branch": "${SOURCE_BRANCH}"
            }
          }
          EOF

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITOPS_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPOSITORY}/dispatches" \
            --data @dispatch.json
